# Herdr configuration managed by ~/.dotfiles.
# Keep this conservative: no machine-specific shell, theme, or aggressive keybinding choices.

onboarding = false

[terminal]
# New panes/tabs start in the current pane's directory.
new_cwd = "follow"
shell_mode = "auto"

[update]
channel = "stable"

[ui]
sidebar_width = 32
sidebar_min_width = 18
sidebar_max_width = 40
mouse_capture = true
right_click_passthrough_modifier = "ctrl"
mouse_scroll_lines = 3
confirm_close = false
prompt_new_tab_name = true
prompt_new_workspace_name = true
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = false

[session]
# Resume supported coding agents when restoring sessions.
resume_agents_on_restore = true

[remote]
# Enable Herdr's temporary per-attach SSH config (keepalive + control-socket
# reuse) for `herdr --remote`. This is a temp config Herdr generates for its own
# connections; it does not modify your real ~/.ssh/config.
manage_ssh_config = true

[experimental]
# Keep disabled by default: pane output can include secrets.
pane_history = false
allow_nested = false
kitty_graphics = true

[advanced]
# Scrollback limit is byte-based.
scrollback_limit_bytes = 52428800
